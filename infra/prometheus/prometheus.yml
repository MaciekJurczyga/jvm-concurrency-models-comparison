global:
  # 1 s resolution is needed to see the S2 phase transitions (plan section 5).
  scrape_interval: 1s
  scrape_timeout: 1s
  evaluation_interval: 1s

scrape_configs:
  # The single SUT service answers as "sut"; the Micrometer tag "model" tells them apart (DECISIONS.md, D11, D16).
  - job_name: sut
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["sut:8080"]

  - job_name: fake-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["fake-api:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
